<!DOCTYPE html>
<html lang="pt-br" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedBroker MRV — Autenticação</title>
    <style>
        :root {
            --mrv-verde: #004d24;
            --mrv-laranja: #f37021;
            --mrv-cinza: #f4f4f9;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--mrv-cinza);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card-seguranca {
            max-width: 450px;
            width: 90%;
            background: white;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            border: 1px solid #eef0f2;
            transition: all 0.3s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--mrv-verde);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            margin-top: 15px;
            margin-bottom: 10px;
            font-size: 1.4rem;
        }

        p {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div class="card-seguranca" id="painel-status">
        <div class="spinner"></div>
        <h2 style="color: var(--mrv-verde);">Verificando Credenciais...</h2>
        <p>Conectando à portaria de segurança SpeedBroker MRV.</p>
    </div>

<script>
        // MODO DESENVOLVIMENTO LOCAL: Redireciona direto para o desktop sem travas
        window.location.href = "desktop.html?ref=carlos8beta&userID=dev_local";
    </script>
</body>
</html>
