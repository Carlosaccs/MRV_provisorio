    function mascararMoeda(elemento) {
        // Apenas para não disparar erro ao digitar nos campos de moeda
        let value = elemento.value.replace(/\D/g, "");
        value = (Number(value) / 100).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
        if (value !== "R$ 0,00") {
            elemento.value = value;
        } else {
            elemento.value = "";
        }
    }

    function imprimirResultado(sistema) {
