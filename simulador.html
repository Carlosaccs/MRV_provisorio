<!-- PRIMEIRA LINHA: INPUTS DE VALORES -->
<div style="display: flex; flex-wrap: nowrap; gap: 10px; align-items: center; margin-bottom: 12px; font-size: 0.8rem; background: transparent; border: none; padding: 0;">
    <div style="display: flex; align-items: center; gap: 4px;">
        <label style="white-space: nowrap;"><input type="radio" name="base-financiamento" value="imovel" checked onchange="simularFluxo()"> Valor imóvel:</label>
        <input type="text" id="sim-val-imovel" value="" placeholder="R$ 0,00" oninput="mascararMoeda(this); simularFluxo()" onblur="formatarAoSair(this)" style="width: 115px; text-align: right; font-size: 0.8rem;">
    </div>

    <div style="display: flex; align-items: center; gap: 4px;">
        <label style="white-space: nowrap;"><input type="radio" name="base-financiamento" value="avaliacao" onchange="simularFluxo()"> Avaliação:</label>
        <input type="text" id="sim-val-avaliacao" value="" placeholder="R$ 0,00" oninput="mascararMoeda(this); simularFluxo()" onblur="formatarAoSair(this)" style="width: 115px; text-align: right; font-size: 0.8rem;">
    </div>

    <div style="display: flex; align-items: center; gap: 4px;">
        <label style="color: var(--mrv-verde); font-weight: bold; white-space: nowrap;">Bom Pagador:</label>
        <input type="text" id="sim-bom-pagador" value="" placeholder="R$ 0,00" oninput="mascararMoeda(this); simularFluxo()" onblur="formatarAoSair(this)" style="width: 90px; text-align: right; font-size: 0.8rem;">
    </div>

    <div style="display: flex; align-items: center; gap: 4px;">
        <label style="white-space: nowrap;">Renda:</label>
        <input type="text" id="sim-renda" value="" placeholder="R$ 0,00" oninput="mascararMoeda(this); simularFluxo()" onblur="formatarAoSair(this)" style="width: 95px; text-align: right; font-size: 0.8rem;">
    </div>

    <div style="display: flex; align-items: center; gap: 4px;">
        <label style="white-space: nowrap;">FGTS:</label>
        <input type="text" id="sim-fgts" value="" placeholder="R$ 0,00" oninput="mascararMoeda(this); simularFluxo()" onblur="formatarAoSair(this)" style="width: 95px; text-align: right; font-size: 0.8rem;">
    </div>

    <div style="display: flex; align-items: center; gap: 4px;">
        <label style="white-space: nowrap;">Recursos:</label>
        <input type="text" id="sim-sinal" value="" placeholder="R$ 0,00" oninput="mascararMoeda(this); simularFluxo()" onblur="formatarAoSair(this)" style="width: 95px; text-align: right; font-size: 0.8rem;">
    </div>

    <div style="display: flex; align-items: center; gap: 8px; margin-left: auto;">
        <label style="white-space: nowrap;"><input type="radio" name="opt-redutor" value="sim" checked onchange="simularFluxo()"> Com redutor</label>
        <label style="white-space: nowrap;"><input type="radio" name="opt-redutor" value="nao" onchange="simularFluxo()"> Sem redutor</label>
    </div>
</div>

<!-- SEGUNDA LINHA: DATA NASCIMENTO E PRAZO MÁXIMO -->
<div style="display: flex; flex-wrap: nowrap; gap: 15px; align-items: center; font-size: 0.8rem; border-top: 1px dashed #ddd; padding-top: 10px;">
    <div style="display: flex; align-items: center; gap: 5px;">
        <label style="white-space: nowrap;">Data nasc:</label>
        <input type="date" id="sim-data-nasc" value="" onchange="calcularPrazoMaximoPorIdade(); simularFluxo();" style="font-size: 0.8rem;">
    </div>

    <div style="display: flex; align-items: center; gap: 5px;">
        <label style="white-space: nowrap;">máximo de:</label>
        <input type="number" id="sim-prazo-finan" value="420" max="420" min="12" style="width: 55px; text-align: center; font-size: 0.8rem;" oninput="simularFluxo()"> parcelas
    </div>

    <div style="display: flex; align-items: center; gap: 5px;">
        <label style="white-space: nowrap;"><input type="checkbox" id="sim-dependente" checked onchange="simularFluxo()"> Mais de um comprador/dependente</label>
    </div>

    <div style="display: flex; align-items: center; gap: 5px;">
        <label style="white-space: nowrap;">Qtd. Parc. entrada:</label>
        <input type="number" id="sim-num-parcelas" value="36" style="width: 45px; text-align: center; font-size: 0.8rem;" oninput="simularFluxo()">
    </div>

    <div style="margin-left: auto; background-color: #e8f5e9; padding: 4px 10px; border-radius: 4px; border: 1px solid var(--mrv-verde); display: flex; align-items: center; gap: 5px;">
        <label style="color: var(--mrv-verde); font-weight: bold; white-space: nowrap;">Subsidio:</label>
        <input type="text" id="sim-subsidio-val" value="R$ 0,00" readonly style="border: none; background: transparent; font-weight: bold; color: var(--mrv-verde); width: 100px; text-align: right; font-size: 0.8rem;">
    </div>
</div>
