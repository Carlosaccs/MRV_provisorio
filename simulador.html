<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedBroker - Sistema Imobiliário</title>
    <link rel="stylesheet" href="desktop.css">
</head>
<body>

    <!-- CABEÇALHO / MENU PRINCIPAL -->
    <header class="app-header">
        <div class="logo-area">
            <h1>SpeedBroker</h1>
        </div>
        <nav class="menu-nav">
            <!-- Botão que aciona o simulador -->
            <button id="btnAbrirSimulador" class="btn-menu" onclick="abrirSimulador()">SPEEDSIM</button>
            <button class="btn-menu">Clientes</button>
            <button class="btn-menu">Imóveis</button>
            <button class="btn-menu">Configurações</button>
        </nav>
    </header>

    <!-- CONTEÚDO PRINCIPAL DO DESKTOP -->
    <main class="app-main">
        <!-- Espaço de Trabalho / Esquerda -->
        <section class="workspace-area">
            <h2>Painel de Gestão e Propostas</h2>
            <p>Selecione uma opção no menu superior ou abra o simulador para começar os cálculos de financiamento.</p>
        </section>

        <!-- Vitrine da Direita -->
        <aside class="right-vitrine">
            <h3>Vitrine de Imóveis</h3>
            <div class="vitrine-card">
                <p><strong>Saint Guilherme</strong></p>
                <p>Vila Guilherme, São Paulo</p>
                <span class="tag-imovel">Disponível</span>
            </div>
        </aside>
    </main>

    <!-- INCLUSÃO DO MODAL DO SIMULADOR DIRETAMENTE AQUI -->
    <div id="simuladorModalRoot">
        <!-- O conteúdo do simulador será carregado aqui ou inserido abaixo -->
    </div>

    <!-- SCRIPTS -->
    <script src="desktop.js"></script>
    <script src="simulador.js"></script>
</body>
</html>
